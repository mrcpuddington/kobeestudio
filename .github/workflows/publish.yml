name: Publish Kobee Studio package

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag, or commit to publish"
        required: true
        default: main
        type: string
      channel:
        description: "Release channel"
        required: true
        default: testing
        type: choice
        options:
          - testing
          - stable
      release_tag:
        description: "GitHub release tag, for example v1.4.0-beta.1 or v1.4.0"
        required: true
        type: string
      release_name:
        description: "Optional GitHub release title"
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish ${{ inputs.channel }} package
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.channel == 'stable' && 'production' || 'testing' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run focused tests
        run: |
          python -m unittest \
            tests.test_ipc_migration.IpcMigrationTests.test_manifest_declares_supported_ipc_runtime \
            tests.test_ipc_migration.IpcMigrationTests.test_pcm_metadata_matches_ipc_manifest_and_catalog_icon_rules \
            tests.test_ipc_migration.IpcMigrationTests.test_ipc_requirements_use_kicad_bundled_wxpython \
            tests.test_ipc_migration.IpcMigrationTests.test_pcm_builder_places_ipc_manifest_in_plugin_subdirectory \
            tests.test_ipc_migration.IpcMigrationTests.test_ipc_session_uses_the_connection_details_from_kicad \
            tests.test_ipc_migration.IpcMigrationTests.test_development_connection_accepts_kicads_empty_external_token \
            tests.test_ipc_migration.IpcMigrationTests.test_ipc_session_fails_clearly_outside_kicad \
            tests.test_ipc_migration.IpcMigrationTests.test_each_plugin_process_has_a_unique_ipc_commit_identity \
            tests.test_ipc_migration.IpcMigrationTests.test_metadata_round_trip_reopens_selected_artwork \
            tests.test_platform_branding

      - name: Build PCM package
        run: python pcm/build.py

      - name: Validate release metadata
        id: package
        shell: python
        env:
          EXPECTED_CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          import json
          import os
          import re
          import zipfile
          from pathlib import Path

          metadata = json.loads(Path("pcm/metadata_template.json").read_text())
          version_entry = metadata["versions"][0]
          version = version_entry["version"]
          status = version_entry["status"]
          expected_status = os.environ["EXPECTED_CHANNEL"]
          release_tag = os.environ["RELEASE_TAG"]

          if not re.fullmatch(r"[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}", version):
              raise SystemExit(
                  f"Invalid KiCad PCM version {version!r}; expected major.minor.patch"
              )
          if status != expected_status:
              raise SystemExit(
                  f"Metadata status is {status!r}, but channel is {expected_status!r}"
              )
          if not release_tag.startswith("v"):
              raise SystemExit("release_tag must start with 'v'")

          archive = Path(f"pcm/build/Kobee-Studio-{version}-pcm.zip")
          if not archive.exists():
              raise SystemExit(f"Missing expected archive: {archive}")

          with zipfile.ZipFile(archive) as package:
              packaged = json.loads(package.read("metadata.json"))
          if packaged["versions"][0]["version"] != version:
              raise SystemExit("Archive metadata does not match source metadata")

          print(f"version={version}")
          print(f"archive={archive}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"archive={archive}\n")

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_NAME: ${{ inputs.release_name }}
          CHANNEL: ${{ inputs.channel }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          title="$RELEASE_NAME"
          if [ -z "$title" ]; then
            title="Kobee Studio $RELEASE_TAG"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ARCHIVE" --clobber
            if [ "$CHANNEL" = "testing" ]; then
              gh release edit "$RELEASE_TAG" --title "$title" --prerelease
            else
              gh release edit "$RELEASE_TAG" --title "$title" --prerelease=false
            fi
          else
            if [ "$CHANNEL" = "testing" ]; then
              gh release create "$RELEASE_TAG" "$ARCHIVE" \
                --title "$title" \
                --target "${{ inputs.source_ref }}" \
                --generate-notes \
                --prerelease
            else
              gh release create "$RELEASE_TAG" "$ARCHIVE" \
                --title "$title" \
                --target "${{ inputs.source_ref }}" \
                --generate-notes
            fi
          fi

      - name: Check PCM repository credential
        env:
          PCM_REPOSITORY_TOKEN: ${{ secrets.PCM_REPOSITORY_TOKEN }}
        run: |
          if [ -z "$PCM_REPOSITORY_TOKEN" ]; then
            echo "PCM_REPOSITORY_TOKEN is not configured for this repository."
            exit 1
          fi

      - name: Check out PCM catalogue
        uses: actions/checkout@v4
        with:
          repository: mrcpuddington/mrcpuddington-kicad-repository
          ref: ${{ inputs.channel == 'stable' && 'main' || 'testing' }}
          token: ${{ secrets.PCM_REPOSITORY_TOKEN }}
          path: pcm-catalogue

      - name: Update PCM catalogue
        shell: python
        env:
          CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          import datetime as dt
          import hashlib
          import json
          import os
          from pathlib import Path

          source_metadata = json.loads(
              Path("pcm/build/metadata.json").read_text(encoding="utf-8")
          )
          version_entry = source_metadata["versions"][0]
          version = version_entry["version"]
          channel = os.environ["CHANNEL"]
          release_tag = os.environ["RELEASE_TAG"]
          archive_name = Path(os.environ["ARCHIVE"]).name

          version_entry["download_url"] = (
              "https://github.com/mrcpuddington/kobeestudio/releases/"
              f"download/{release_tag}/{archive_name}"
          )
          catalogue = Path("pcm-catalogue")
          packages_path = catalogue / "packages.json"
          existing_catalogue = json.loads(
              packages_path.read_text(encoding="utf-8")
          )
          existing_package = next(
              (
                  package
                  for package in existing_catalogue.get("packages", [])
                  if package.get("identifier") == source_metadata["identifier"]
              ),
              None,
          )
          if existing_package:
              versions_by_number = {
                  entry["version"]: entry
                  for entry in existing_package.get("versions", [])
              }
              versions_by_number[version] = version_entry
              source_metadata["versions"] = sorted(
                  versions_by_number.values(),
                  key=lambda entry: tuple(
                      int(part) for part in entry["version"].split(".")
                  ),
                  reverse=True,
              )
          packages = {"packages": [source_metadata]}
          packages_path.write_text(
              json.dumps(packages, indent=2) + "\n", encoding="utf-8"
          )

          repository_path = catalogue / "repository.json"
          repository = json.loads(repository_path.read_text(encoding="utf-8"))
          branch = "main" if channel == "stable" else "testing"
          repository["packages"]["url"] = (
              "https://raw.githubusercontent.com/"
              "mrcpuddington/mrcpuddington-kicad-repository/"
              f"{branch}/packages.json"
          )
          repository["packages"]["sha256"] = hashlib.sha256(
              packages_path.read_bytes()
          ).hexdigest()
          now = dt.datetime.now(dt.timezone.utc)
          repository["packages"]["update_time_utc"] = now.strftime(
              "%Y-%m-%d %H:%M:%S"
          )
          repository["packages"]["update_timestamp"] = int(now.timestamp())
          repository_path.write_text(
              json.dumps(repository, indent=2) + "\n", encoding="utf-8"
          )

          print(f"Updated {channel} catalogue to Kobee Studio {version}")

      - name: Commit and push PCM catalogue
        working-directory: pcm-catalogue
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repository.json packages.json
          if git diff --cached --quiet; then
            echo "PCM catalogue is already up to date."
            exit 0
          fi
          git commit -m "Publish Kobee Studio ${{ steps.package.outputs.version }} $CHANNEL"
          git push origin "HEAD:$([ "$CHANNEL" = "stable" ] && echo main || echo testing)"
