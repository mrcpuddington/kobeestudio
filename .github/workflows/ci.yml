name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - UI2.0

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare native test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-wxgtk4.0 python3-venv xvfb
          /usr/bin/python3 -m venv --system-site-packages /tmp/kobee-tests
          /tmp/kobee-tests/bin/python -m pip install -r ipc_plugin/requirements.txt

      - name: Run complete test suite
        run: xvfb-run -a /tmp/kobee-tests/bin/python tools/run_tests.py

      - name: Build PCM package
        run: python pcm/build.py

      - name: Verify package metadata
        shell: python
        run: |
          import json
          import zipfile
          from pathlib import Path

          metadata = json.loads(Path("pcm/metadata_template.json").read_text())
          version = metadata["versions"][0]["version"]
          archive = Path(f"pcm/build/Kobee-Studio-{version}-pcm.zip")

          if not archive.exists():
              raise SystemExit(f"Missing expected archive: {archive}")

          with zipfile.ZipFile(archive) as package:
              packaged = json.loads(package.read("metadata.json"))

          packaged_version = packaged["versions"][0]["version"]
          if packaged_version != version:
              raise SystemExit(
                  f"Package version {packaged_version!r} does not match {version!r}"
              )

          print(f"Verified {archive} ({version})")

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: kobee-studio-pcm
          path: pcm/build/Kobee-Studio-*-pcm.zip
          if-no-files-found: error
